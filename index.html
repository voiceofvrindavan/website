<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice of Vrindavan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="world">

    <div class="sky"></div>
    <div class="sun"></div>

    <div class="hill hill-back"></div>
    <div class="hill hill-middle"></div>

    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>

    <div class="bird bird-one">⌁</div>
    <div class="bird bird-two">⌁</div>
    <div class="bird bird-three">⌁</div>

    <div class="yamuna">
        <div class="water-line line-one"></div>
        <div class="water-line line-two"></div>
        <div class="water-line line-three"></div>
        <div class="water-line line-four"></div>
    </div>

    <div class="ground"></div>

    <div class="tree tree-left">
        <div class="trunk"></div>
        <div class="branch branch-one"></div>
        <div class="branch branch-two"></div>
        <div class="branch branch-three"></div>

        <div class="leaf leaf-one"></div>
        <div class="leaf leaf-two"></div>
        <div class="leaf leaf-three"></div>
        <div class="leaf leaf-four"></div>
        <div class="leaf leaf-five"></div>
        <div class="leaf leaf-six"></div>
    </div>

    <div class="tree tree-right">
        <div class="trunk"></div>
        <div class="branch branch-one"></div>
        <div class="branch branch-two"></div>

        <div class="leaf leaf-one"></div>
        <div class="leaf leaf-two"></div>
        <div class="leaf leaf-three"></div>
        <div class="leaf leaf-four"></div>
    </div>

    <div class="house">
        <div class="house-wall"></div>
        <div class="roof"></div>
        <div class="door"></div>
        <div class="window"></div>
        <div class="lamp"></div>
    </div>

    <div class="house house-two">
        <div class="house-wall"></div>
        <div class="roof"></div>
        <div class="door"></div>
    </div>

    <div class="flowers">
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
    </div>

    <div class="cow">
        <div class="cow-body"></div>
        <div class="cow-head"></div>

        <div class="cow-ear ear-one"></div>
        <div class="cow-ear ear-two"></div>

        <div class="cow-leg leg-one"></div>
        <div class="cow-leg leg-two"></div>
        <div class="cow-leg leg-three"></div>
        <div class="cow-leg leg-four"></div>

        <div class="cow-tail"></div>
    </div>

    <div class="peacock">
        <div class="peacock-body"></div>
        <div class="peacock-neck"></div>
        <div class="peacock-head"></div>

        <div class="peacock-feather feather-one"></div>
        <div class="peacock-feather feather-two"></div>
        <div class="peacock-feather feather-three"></div>
        <div class="peacock-feather feather-four"></div>
    </div>

    <div class="villager">
        <div class="villager-head"></div>
        <div class="villager-body"></div>

        <div class="villager-arm arm-left"></div>
        <div class="villager-arm arm-right"></div>

        <div class="villager-leg leg-left"></div>
        <div class="villager-leg leg-right"></div>
    </div>

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="logo-symbol">
        <div class="logo-circle"></div>
    </div>

    <div class="vignette"></div>

</main>

<script src="script.js"></script>

</body>
</html>
